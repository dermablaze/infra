# DermaBlaze ERP — Test environment
# Serves test SPA and proxies API to port 3001.
# Domain: test-erp.dermablze.com
#
# Enable: ln -sf /opt/apps/dermablaze-infra/nginx/dermablaze-test-erp.conf /etc/nginx/sites-enabled/
# SSL:    certbot --nginx -d test-erp.dermablze.com

server {
    listen 80;
    server_name test-erp.dermablze.com;

    root /var/www/dermablaze-erp-test;
    index index.html;

    # API proxy — test instance on port 3001
    location /api/ {
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        client_max_body_size 10M;
    }

    location / {
        try_files $uri /index.html;
    }

    location ~* \.(js|css|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 256;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
