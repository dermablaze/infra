# DermaBlaze ERP — Nginx config
# Serves: React SPA + proxies /api to Fastify (port 3000)
# Domain: erp.dermablaze.com
#
# Enable: ln -sf /opt/dermablaze-infra/nginx/dermablaze-erp.conf /etc/nginx/sites-enabled/
# SSL:    certbot --nginx -d erp.dermablaze.com

server {
    listen 80;
    server_name erp.dermablaze.com;

    # React SPA
    root /var/www/dermablaze-web;
    index index.html;

    location / {
        try_files $uri /index.html;
    }

    # API reverse proxy
    location /api/ {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }

    # Swagger docs
    location /docs {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 256;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
