# DermaBlaze ERP frontend — Nginx config
# Serves: React SPA (static files only — API is on api.dermablaze.com)
# Domain: erp.dermablaze.com
#
# Enable: ln -sf /opt/dermablaze-infra/nginx/dermablaze-erp.conf /etc/nginx/sites-enabled/
# SSL:    certbot --nginx -d erp.dermablaze.com

server {
    listen 80;
    server_name erp.dermablaze.com;

    root /var/www/dermablaze-web;
    index index.html;

    location / {
        try_files $uri /index.html;
    }

    # Cache JS/CSS bundles (Vite adds content hashes)
    location ~* \.(js|css|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 256;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
