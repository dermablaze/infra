# DermaBlaze public website — Nginx config
# Serves: Next.js static export (output: "export")
# Domain: dermablaze.com + www.dermablaze.com
#
# Enable: ln -sf /opt/dermablaze-infra/nginx/dermablaze-website.conf /etc/nginx/sites-enabled/
# SSL:    certbot --nginx -d dermablaze.com -d www.dermablaze.com

server {
    listen 80;
    server_name dermablaze.com www.dermablaze.com;

    # Redirect www → non-www
    if ($host = www.dermablaze.com) {
        return 301 https://dermablaze.com$request_uri;
    }

    root /var/www/dermablaze-website;
    index index.html;

    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }

    # Cache static assets aggressively
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 256;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
