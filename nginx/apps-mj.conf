# apps-mj.work.gd — Nginx config
# Change PORT below to whatever port your app runs on.
# Add new location blocks here for multiple apps on this domain.
#
# Enable: ln -sf /opt/dermablaze-infra/nginx/apps-mj.conf /etc/nginx/sites-enabled/
# SSL:    certbot --nginx -d apps-mj.work.gd

server {
    listen 80;
    server_name apps-mj.work.gd;

    # TODO: change 3001 to the port your app runs on
    location / {
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
}
