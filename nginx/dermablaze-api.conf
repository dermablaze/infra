# DermaBlaze ERP API — Nginx config
# Proxies all traffic to Fastify (port 3000, Docker container)
# Domain: api.dermablaze.com
#
# Enable: ln -sf /opt/dermablaze-infra/nginx/dermablaze-api.conf /etc/nginx/sites-enabled/
# SSL:    certbot --nginx -d api.dermablaze.com

server {
    listen 80;
    server_name api.dermablaze.com;

    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;

        # Large payloads (invoice PDFs etc.)
        client_max_body_size 10M;
    }

    gzip on;
    gzip_types application/json;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
