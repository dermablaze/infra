# Template — copy this for each new site/app
# Replace: DOMAIN, PORT (for proxy), or WEB_ROOT (for static)
#
# Enable: ln -sf /opt/dermablaze-infra/nginx/DOMAIN.conf /etc/nginx/sites-enabled/
# SSL:    certbot --nginx -d DOMAIN

# Option A: Reverse proxy (Node.js / any backend)
server {
    listen 80;
    server_name DOMAIN;

    location / {
        proxy_pass         http://127.0.0.1:PORT;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
}

