# Notification Service — Nginx config
# Proxies traffic to the notification-service container (port 4000)
# Domain: notify.dermablze.com
#
# Enable: ln -sf /opt/apps/dermablaze-infra/nginx/notify.conf /etc/nginx/sites-enabled/
# SSL:    certbot --nginx -d notify.dermablze.com

server {
    listen 80;
    server_name notify.dermablze.com;

    location / {
        proxy_pass         http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        client_max_body_size 1M;
    }

    gzip on;
    gzip_types application/json;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
