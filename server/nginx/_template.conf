# ============================================================
# Template for a new site/app
# Copy this file: cp _template.conf myapp.conf
# Then replace:
#   YOUR_DOMAIN  → actual domain (e.g. app.dermablaze.com)
#   YOUR_PORT    → local port the app runs on (e.g. 3001)
#   /var/www/YOUR_STATIC_DIR → if serving static files (remove proxy block)
# Enable: ln -s /etc/nginx/sites-available/myapp.conf /etc/nginx/sites-enabled/
# Test:   nginx -t
# Reload: systemctl reload nginx
# SSL:    certbot --nginx -d YOUR_DOMAIN
# ============================================================

server {
    listen 80;
    server_name YOUR_DOMAIN;

    # ---- Option A: Reverse proxy to a Node/backend app ----
    location / {
        proxy_pass         http://127.0.0.1:YOUR_PORT;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # ---- Option B: Serve static files (React/HTML site) ----
    # root /var/www/YOUR_STATIC_DIR;
    # index index.html;
    # location / {
    #     try_files $uri $uri/ /index.html;
    # }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 256;
}
