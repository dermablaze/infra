# DermaBlaze — Docker Compose
# API uses host networking to reach PostgreSQL on localhost:5432.
# Nginx runs on the host for SSL cert management + static files.
#
# Secrets live in /opt/secrets/ (not inside app dirs).
#
# Usage:
#   docker compose -f /opt/apps/dermablaze-infra/docker/docker-compose.yml ps
#   docker compose -f /opt/apps/dermablaze-infra/docker/docker-compose.yml logs -f api

services:
  api:
    image: dermablaze-api:latest
    restart: unless-stopped
    network_mode: host
    env_file:
      - /opt/secrets/dermablaze-api.env
    volumes:
      - /var/log/apps/dermablaze:/var/log/dermablaze
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  api-test:
    image: dermablaze-api:latest
    restart: unless-stopped
    network_mode: host
    env_file:
      - /opt/secrets/dermablaze-api-test.env
    volumes:
      - /var/log/apps/dermablaze:/var/log/dermablaze
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  notification:
    image: notification-service:latest
    restart: unless-stopped
    network_mode: host
    env_file:
      - /opt/secrets/notification-service.env
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
